<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#162f4e" />
    <title>WhatsApp Vivka</title>
    <link rel="icon" href="/brand/favicon.png" />
    <style>
      :root { color-scheme: light; font-family: Arial, Helvetica, sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #f5f0e7; color: #162f4e; }
      main { width: min(100%, 460px); padding: 40px 30px; border: 1px solid #c7a968; border-radius: 24px; background: #fffaf2; box-shadow: 0 18px 50px #162f4e14; text-align: center; }
      .mark { display: block; width: 106px; height: auto; margin: 0 auto 26px; }
      .eyebrow { margin: 0 0 12px; color: #806528; font-size: 11px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(28px, 7vw, 38px); font-weight: 500; line-height: 1.12; }
      p { margin: 18px 0 0; font-size: 15px; line-height: 1.55; }
      a.button { display: block; margin-top: 28px; padding: 15px 20px; border-radius: 100px; background: #162f4e; color: #fffaf2; font-weight: 700; text-decoration: none; }
      a.button:hover, a.button:focus-visible { background: #24486e; }
      .hint { color: #526174; font-size: 12px; }
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="/brand/logo-azul.png" alt="Vivka" />
      <p class="eyebrow">Atendimento Vivka</p>
      <h1>Vamos conversar?</h1>
      <p>Você será direcionado para o WhatsApp da Vivka em instantes.</p>
      <a id="whatsapp-link" class="button" href="https://wa.me/5551992722740" rel="nofollow">Abrir WhatsApp agora</a>
      <p class="hint">Se o redirecionamento não acontecer, toque no botão acima.</p>
      <noscript><p class="hint">O redirecionamento automático requer JavaScript. O botão continua disponível.</p></noscript>
    </main>
    <script>
      (() => {
        const destination = new URL("https://wa.me/5551992722740");
        const message = new URLSearchParams(window.location.search).get("text");
        if (message) destination.searchParams.set("text", message);
        document.getElementById("whatsapp-link").href = destination.href;
        window.setTimeout(() => window.location.replace(destination.href), 1500);
      })();
    </script>
  </body>
</html>
